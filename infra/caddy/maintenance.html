<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="5">
<title>Ralph Arena — Updating</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0b0f19;color:#e2e8f0;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{text-align:center;padding:40px 32px;max-width:400px}
.logo{font-size:24px;font-weight:700;letter-spacing:-.5px;margin-bottom:32px;color:#fff}
.logo span{color:#10b981}
.spinner{width:32px;height:32px;border:3px solid #1e293b;border-top-color:#10b981;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 24px}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:18px;font-weight:600;margin-bottom:8px}
p{font-size:13px;color:#94a3b8;line-height:1.6}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Ralph <span>Arena</span></div>
  <div class="spinner"></div>
  <h1>Updating</h1>
  <p>The app is restarting. This page will refresh automatically.</p>
</div>
</body>
</html>
